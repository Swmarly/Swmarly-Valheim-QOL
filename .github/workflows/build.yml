name: build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Get live Valheim server buildid
        id: buildid
        run: |
          BUILDID=$(curl -s https://api.steamcmd.net/v1/info/896660 | jq -r '.data."896660".depots.branches.public.buildid')
          echo "buildid=$BUILDID" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        id: cache
        with:
          path: lib/
          key: valheim-1.0-libs-${{ steps.buildid.outputs.buildid }}

      - name: Fetch Valheim assemblies and BepInEx core
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p lib depot-cache

          curl -sL https://github.com/SteamRE/DepotDownloader/releases/latest/download/DepotDownloader-linux-x64.zip -o dd.zip
          unzip -q dd.zip -d dd
          chmod +x dd/DepotDownloader
          ./dd/DepotDownloader -app 896660 -depot 896661 -os linux -dir ./depot-cache -validate

          MANAGED="depot-cache/valheim_server_Data/Managed"
          cp "$MANAGED"/{assembly_valheim,assembly_utils,assembly_guiutils,assembly_postprocessing,assembly_googleanalytics}.dll lib/
          cp "$MANAGED"/com.rlabrecque.steamworks.net.dll lib/
          cp "$MANAGED"/UnityEngine{,.CoreModule,.PhysicsModule,.AnimationModule,.IMGUIModule,.InputLegacyModule,.UI,.UIModule}.dll lib/
          cp "$MANAGED"/Unity.TextMeshPro.dll lib/

          curl -sL "https://thunderstore.io/package/download/denikson/BepInExPack_Valheim/5.4.2350/" -o bie.zip
          unzip -q bie.zip -d bie
          cp bie/BepInExPack_Valheim/BepInEx/core/{BepInEx,0Harmony,BepInEx.Harmony,Mono.Cecil}.dll lib/

          rm -rf depot-cache dd.zip dd bie.zip bie

      - name: Build Swmarly Valheim QOL
        run: dotnet build src -c Release -p:ValheimManagedDir="${{ github.workspace }}/lib" -p:BepInExCoreDir="${{ github.workspace }}/lib"

      - name: Assemble Thunderstore package
        run: python3 scripts/package.py

      - uses: actions/upload-artifact@v4
        with:
          name: thunderstore-package
          path: dist/SwmarlyValheimQOL-*.zip
          if-no-files-found: error
